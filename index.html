<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Bot Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #a78bfa; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="number"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; outline: none; }
        button.start-btn { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button.start-btn:hover { background: #059669; }
        button.start-btn:disabled { background: #64748b; cursor: not-allowed; }
        .actions { display: flex; gap: 10px; margin-bottom: 15px; }
        .actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-copy-all { background: #3b82f6; color: white; }
        .btn-clear { background: #ef4444; color: white; }
        .email-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 5px; }
        .email-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid #3b82f6; }
        .email-text { font-family: monospace; font-size: 14px; color: #cbd5e1; word-break: break-all; }
        .btn-copy { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-copy:hover { background: #475569; }
        .status { text-align: center; font-size: 13px; color: #38bdf8; margin-bottom: 10px; height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🤖 Meta Auto Creator</h2>
        <div class="input-group">
            <input type="number" id="accCount" value="1" min="1" max="10" placeholder="How many accounts?">
            <button class="start-btn" id="startBtn" onclick="startBot()">Start</button>
        </div>
        <div class="status" id="statusText"></div>
        <div class="actions">
            <button class="btn-copy-all" onclick="copyAll()">Copy All Emails</button>
            <button class="btn-clear" onclick="clearData()">Reset</button>
        </div>
        <div class="email-list" id="emailList"></div>
    </div>

    <script>
        let savedEmails = [];

        function renderEmails() {
            const list = document.getElementById('emailList');
            list.innerHTML = '';
            if (savedEmails.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:10px;">No emails generated yet.</div>';
                return;
            }
            savedEmails.slice().reverse().forEach((email) => {
                const div = document.createElement('div');
                div.className = 'email-item';
                div.innerHTML = `<span class="email-text">${email}</span><button class="btn-copy" onclick="copyOne('${email}', this)">Copy</button>`;
                list.appendChild(div);
            });
        }

        function copyOne(email, btnElement) {
            navigator.clipboard.writeText(email).then(() => {
                btnElement.textContent = 'Copied!';
                btnElement.style.background = '#10b981';
                setTimeout(() => { btnElement.textContent = 'Copy'; btnElement.style.background = '#334155'; }, 1500);
            });
        }

        function copyAll() {
            if (savedEmails.length === 0) return alert('No emails to copy!');
            navigator.clipboard.writeText(savedEmails.join('\n')).then(() => {
                const btn = document.querySelector('.btn-copy-all');
                btn.textContent = 'Copied All!';
                btn.style.background = '#10b981';
                setTimeout(() => { btn.textContent = 'Copy All Emails'; btn.style.background = '#3b82f6'; }, 1500);
            });
        }

        function clearData() {
            if (confirm('Are you sure you want to clear all history?')) {
                fetch('/api/reset', { method: 'POST' });
                savedEmails = [];
                localStorage.setItem('meta_emails', JSON.stringify([]));
                renderEmails();
            }
        }

        async function startBot() {
            const count = document.getElementById('accCount').value;
            if (count < 1) return alert('Minimum 1 account needed.');

            const startBtn = document.getElementById('startBtn');
            const statusText = document.getElementById('statusText');

            startBtn.disabled = true;
            startBtn.textContent = 'Running...';
            statusText.textContent = `Starting ${count} workers...`;

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: parseInt(count) })
                });
                const data = await response.json();
                statusText.textContent = data.message + " Emails will appear automatically.";
            } catch (err) {
                alert("Server connection failed!");
            } finally {
                setTimeout(() => {
                    startBtn.disabled = false;
                    startBtn.textContent = 'Start';
                }, 3000);
            }
        }

        // লাইভ Polling: প্রতি ৩ সেকেন্ডে সার্ভার থেকে নতুন ইমেইল চেক করবে
        async function pollEmails() {
            try {
                const res = await fetch('/api/emails');
                const data = await res.json();
                if (data.emails && data.emails.length !== savedEmails.length) {
                    savedEmails = data.emails;
                    localStorage.setItem('meta_emails', JSON.stringify(savedEmails));
                    renderEmails();
                }
            } catch(e) {}
        }

        setInterval(pollEmails, 3000);

        // পেজ লোড হলে লোকাল স্টোরেজ থেকে দেখাবে
        savedEmails = JSON.parse(localStorage.getItem('meta_emails')) || [];
        renderEmails();
        pollEmails();
    </script>
</body>
</html>
