<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamim Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  
  *{box-sizing:border-box; font-family:'Inter', sans-serif;}
  body{margin:0; background:#0f172a; color:#e2e8f0; min-height:100vh;}
  
  /* Header */
  header{padding:20px 24px; background:#1e293b; display:flex; justify-content:center; align-items:center; border-bottom:1px solid #334155; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:24px; color:#f8fafc; font-weight:700; letter-spacing:1px;}
  
  .container{padding:24px; display:grid; gap:24px; max-width:1200px; margin:0 auto;}
  
  /* Cards */
  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px;}
  .card{background:#1e293b; padding:24px; border-radius:12px; border:1px solid #334155; text-align:center; transition:transform 0.2s; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  .card:hover{transform:translateY(-2px); border-color:#3b82f6;}
  .card .label{font-size:13px; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; font-weight:600;}
  .card .value{font-size:36px; font-weight:700; margin-top:12px; color:#10b981;}
  
  /* Panels */
  .panel{background:#1e293b; border-radius:12px; border:1px solid #334155; overflow:hidden; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  .panel-header{padding:16px 20px; background:#0f172a; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .panel-header h2{margin:0; font-size:16px; font-weight:600; color:#f8fafc; display:flex; align-items:center; gap:8px;}
  
  .search-box { padding:8px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:13px; outline:none; width:200px; }
  .search-box:focus { border-color:#3b82f6; }

  .btn{padding:10px 18px; border-radius:8px; border:none; background:#3b82f6; color:#fff; cursor:pointer; font-size:14px; font-weight:600; transition:background 0.2s;}
  .btn:hover{background:#2563eb;}
  .btn:disabled{background:#475569; cursor:not-allowed; opacity:0.7;}
  
  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:14px; table-layout: fixed;}
  th,td{text-align:left; padding:14px 20px; border-bottom:1px solid #334155;}
  th{color:#94a3b8; font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#1e293b;}
  
  /* OTP Highlight */
  .otp-highlight{background:#10b981; color:#fff; padding:6px 12px; border-radius:6px; font-family:monospace; font-size:18px; font-weight:700; display:inline-block; letter-spacing:2px; box-shadow:0 2px 8px rgba(16,185,129,0.4);}
  .empty-state{padding:30px; text-align:center; color:#64748b; font-size:14px;}
  
  /* Single line message */
  .msg-text {
    color: #cbd5e1;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    width: 100%;
  }
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  .badge-live { font-size:12px; color:#10b981; display:flex; align-items:center; gap:6px; font-weight:600; }
  .dot-pulse { width:8px; height:8px; background:#10b981; border-radius:50%; display:inline-block; animation:pulse 2s infinite; }
</style>
</head>
<body>

<header>
  <h1>Tamim Panel</h1>
</header>

<div class="container">

  <!-- 1. MY NUMBERS + SEARCH BAR -->
  <div class="panel">
    <div class="panel-header">
      <h2>📱 My Numbers <span id="numberCount" style="color:#3b82f6; margin-left:8px; background:rgba(59,130,246,0.1); padding:2px 8px; border-radius:12px;">0</span></h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="rangeSearch" class="search-box" placeholder="Search by Range..." oninput="loadNumbers()">
        <button class="btn" id="getNumberBtn" onclick="getNumber()">Get Number</button>
      </div>
    </div>
    <div style="max-height:300px; overflow-y:auto;">
      <table>
        <thead>
          <tr><th style="width: 50%;">Number</th><th style="width: 50%;">Range</th></tr>
        </thead>
        <tbody id="numbersTableBody">
          <tr><td colspan="2" class="empty-state">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 2. TOTAL OTP CARD -->
  <div class="cards">
    <div class="card">
      <div class="label">Total OTP Received</div>
      <div class="value" id="totalOTP">0</div>
    </div>
  </div>

  <!-- 3. LATEST OTP LIST -->
  <div class="panel">
    <div class="panel-header">
      <h2>⚡ Latest OTPs</h2>
      <span class="badge-live"><span class="dot-pulse"></span> Live</span>
    </div>
    <div style="max-height:400px; overflow-y:auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 15%;">Time</th>
            <th style="width: 20%;">Number</th>
            <th style="width: 20%;">OTP Code</th>
            <th style="width: 45%;">Message</th>
          </tr>
        </thead>
        <tbody id="otpTableBody">
          <tr><td colspan="4" class="empty-state">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<style>
@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
</style>

<script>
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  return res.json();
}

function extractOTP(text) {
  if (!text) return null;
  const ps = [/\b(\d{4,8})\b.{0,30}(?:code|otp|verification|pin)/i, /(?:code|otp|verification|pin)[^\d]{0,15}(\d{4,8})\b/i, /\b(\d{6})\b/, /\b(\d{4,8})\b/];
  for (const p of ps) { const m = text.match(p); if (m) return m[1]; }
  return null;
}

async function init() {
  await loadNumbers();
  await loadLocalMessages();
  
  setInterval(async () => {
    await loadLocalMessages();
    await loadNumbers(); 
  }, 10000);
}

async function loadNumbers() {
  try {
    const range = document.getElementById('rangeSearch').value;
    const url = '/api/numbers/local' + (range ? `?range_name=${encodeURIComponent(range)}` : '');
    const res = await api(url);
    if (res.data) {
      renderNumbers(res.data);
    }
  } catch (e) {}
}

function renderNumbers(nums) {
  const tbody = document.getElementById('numbersTableBody');
  document.getElementById('numberCount').innerText = nums.length;
  
  if (!nums || nums.length === 0) {
    tbody.innerHTML = `<tr><td colspan="2" class="empty-state">No numbers found matching your search.</td></tr>`;
    return;
  }
  
  tbody.innerHTML = nums.map(n => `
    <tr>
      <td style="font-weight:600; color:#f8fafc; font-family:monospace; font-size:15px;">${n.number}</td>
      <td style="color:#94a3b8;">${n.range_name}</td>
    </tr>
  `).join('');
}

async function loadLocalMessages() {
  try {
    const res = await api('/api/messages/local?limit=50');
    renderMessages(res.data || []);
    document.getElementById('totalOTP').innerText = res.total || 0;
  } catch (e) {}
}

function renderMessages(msgs) {
  const tbody = document.getElementById('otpTableBody');
  if (!msgs || msgs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No OTPs received yet.</td></tr>`;
    return;
  }
  
  tbody.innerHTML = msgs.map(m => {
    const otp = m.otp || extractOTP(m.message);
    return `
      <tr>
        <td style="color:#94a3b8; font-size:12px; white-space:nowrap;">${new Date(m.received_at).toLocaleTimeString()}</td>
        <td style="font-weight:500; font-family:monospace;">${m.number}</td>
        <td>${otp ? `<span class="otp-highlight">${otp}</span>` : '<span style="color:#64748b;">-</span>'}</td>
        <td><span class="msg-text" title="${m.message}">${m.message}</span></td>
      </tr>
    `;
  }).join('');
}

async function getNumber() {
  if(!confirm("Are you sure you want to take a number? It will be removed from the list.")) return;
  
  const btn = document.getElementById('getNumberBtn');
  btn.innerText = "Processing...";
  btn.disabled = true;

  try {
    const res = await api('/api/numbers/get', { method: 'POST' });
    if (res.success) {
      // অটোমেটিক কপি করার সিস্টেম
      navigator.clipboard.writeText(res.number).then(() => {
        alert(`🎉 Number Copied: ${res.number}\nIt has been removed from the list.`);
      }).catch(() => {
        alert(`🎉 Number Selected: ${res.number}\n(Could not copy automatically)`);
      });
      
      await loadNumbers(); 
    } else {
      alert(res.message || "Failed to get number");
    }
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    btn.innerText = "Get Number";
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
