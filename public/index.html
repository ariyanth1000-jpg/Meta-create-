<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamim Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  
  *{box-sizing:border-box; font-family:'Inter', sans-serif;}
  body{margin:0; background:#0f172a; color:#e2e8f0; min-height:100vh;}
  
  /* Header */
  header{padding:16px 24px; background:#1e293b; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:22px; color:#f8fafc; font-weight:700; letter-spacing:1px;}
  
  /* Corner OTP Badge */
  .corner-badge {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid #10b981;
    color: #10b981;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .container{padding:24px; display:grid; gap:24px; max-width:1200px; margin:0 auto;}
  
  /* Panels */
  .panel{background:#1e293b; border-radius:12px; border:1px solid #334155; overflow:hidden; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  .panel-header{padding:16px 20px; background:#0f172a; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  .panel-header h2{margin:0; font-size:16px; font-weight:600; color:#f8fafc; display:flex; align-items:center; gap:8px;}
  
  /* Form controls */
  .select-box { padding:10px 14px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:14px; outline:none; min-width:220px; cursor:pointer;}
  .select-box:focus { border-color:#3b82f6; }

  .btn{padding:10px 20px; border-radius:8px; border:none; background:#3b82f6; color:#fff; cursor:pointer; font-size:14px; font-weight:600; transition:background 0.2s;}
  .btn:hover{background:#2563eb;}
  .btn:disabled{background:#475569; cursor:not-allowed; opacity:0.7;}
  
  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:14px; table-layout: fixed;}
  th,td{text-align:left; padding:12px 20px; border-bottom:1px solid #334155;}
  th{color:#94a3b8; font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#1e293b;}
  
  /* Single line scrollable message */
  .msg-scroll {
    color: #cbd5e1;
    font-size: 13px;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    display: block;
    width: 100%;
    scrollbar-width: thin; /* Firefox */
  }
  .msg-scroll::-webkit-scrollbar { height: 4px; }
  .msg-scroll::-webkit-scrollbar-track { background: transparent; }
  .msg-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
  .msg-scroll:hover::-webkit-scrollbar-thumb { background: #64748b; }

  .empty-state{padding:30px; text-align:center; color:#64748b; font-size:14px;}
</style>
</head>
<body>

<header>
  <h1>Tamim Panel</h1>
  <div class="corner-badge">
    📩 <span id="totalOTP">0</span> OTP Received
  </div>
</header>

<div class="container">

  <!-- 1. GET NUMBER BY RANGE PANEL -->
  <div class="panel">
    <div class="panel-header">
      <h2>📱 Get Number by Range</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <select id="rangeDropdown" class="select-box">
          <option value="">Loading ranges...</option>
        </select>
        <button class="btn" id="getNumberBtn" onclick="getNumber()">Get Number</button>
      </div>
    </div>
  </div>

  <!-- 2. LATEST OTP LIST PANEL -->
  <div class="panel">
    <div class="panel-header">
      <h2>⚡ Latest OTPs</h2>
      <span style="font-size:12px; color:#10b981; font-weight:600; display:flex; align-items:center; gap:6px;">
        <span style="width:8px; height:8px; background:#10b981; border-radius:50%; display:inline-block;"></span> Live
      </span>
    </div>
    <div style="max-height:500px; overflow-y:auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 30%;">Number</th>
            <th style="width: 70%;">Message</th>
          </tr>
        </thead>
        <tbody id="otpTableBody">
          <tr><td colspan="2" class="empty-state">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  return res.json();
}

async function init() {
  await loadRanges();
  await loadLocalMessages();
  
  // প্রতি ১০ সেকেন্ডে ডাটা অটো আপডেট হবে
  setInterval(async () => {
    await loadLocalMessages();
    await loadRanges(); // নতুন নাম্বার এলে রেঞ্জও আপডেট হবে
  }, 10000);
}

// Dropdown-এ রেঞ্জ লোড করা
async function loadRanges() {
  try {
    const res = await api('/api/ranges');
    const dropdown = document.getElementById('rangeDropdown');
    const currentVal = dropdown.value;
    
    if (!res.data || res.data.length === 0) {
      dropdown.innerHTML = `<option value="">No ranges available</option>`;
      return;
    }
    
    let options = `<option value="">Select Range...</option>`;
    res.data.forEach(r => {
      options += `<option value="${r}">${r}</option>`;
    });
    dropdown.innerHTML = options;
    
    // আগের সিলেক্ট করা রেঞ্জটা আবার সিলেক্ট করে রাখবে
    if (currentVal && res.data.includes(currentVal)) {
      dropdown.value = currentVal;
    }
  } catch (e) {}
}

// OTP লিস্ট লোড করা
async function loadLocalMessages() {
  try {
    const res = await api('/api/messages/local?limit=100');
    renderMessages(res.data || []);
    document.getElementById('totalOTP').innerText = res.total || 0;
  } catch (e) {}
}

function renderMessages(msgs) {
  const tbody = document.getElementById('otpTableBody');
  if (!msgs || msgs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="2" class="empty-state">No OTPs received yet.</td></tr>`;
    return;
  }
  
  tbody.innerHTML = msgs.map(m => {
    return `
      <tr>
        <td style="font-weight:500; font-family:monospace; font-size:15px; color:#f8fafc;">${m.number}</td>
        <td>
          <span class="msg-scroll" title="${m.message}">${m.message}</span>
        </td>
      </tr>
    `;
  }).join('');
}

// Get Number বাটনের কাজ
async function getNumber() {
  const range = document.getElementById('rangeDropdown').value;
  
  if (!range) {
    alert("Please select a Range first!");
    return;
  }
  
  const btn = document.getElementById('getNumberBtn');
  btn.innerText = "Processing...";
  btn.disabled = true;

  try {
    const res = await api('/api/numbers/get', { 
      method: 'POST',
      body: JSON.stringify({ range })
    });
    
    if (res.success) {
      // অটোমেটিক কপি করার সিস্টেম
      navigator.clipboard.writeText(res.number).then(() => {
        alert(`🎉 Number Copied: ${res.number}\nIt has been removed from the list.`);
      }).catch(() => {
        alert(`🎉 Number Selected: ${res.number}\n(Could not copy automatically)`);
      });
      
      await loadRanges(); // লিস্ট আপডেট হবে
    } else {
      alert(res.message || "Failed to get number");
    }
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    btn.innerText = "Get Number";
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
