<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamim Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  
  *{box-sizing:border-box; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent;}
  body{margin:0; background:#0f172a; color:#e2e8f0; min-height:100vh;}
  
  /* Header */
  header{padding:16px 20px; background:#1e293b; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:22px; color:#f8fafc; font-weight:700; letter-spacing:1px;}
  
  .badge {
    background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981;
    padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
  }
  
  .container{padding:20px; display:flex; flex-direction:column; gap:20px; max-width:800px; margin:0 auto;}
  
  /* Control Panel */
  .control-panel{background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; display:flex; flex-direction:column; gap:12px;}
  .control-panel h2{margin:0 0 10px 0; font-size:16px; color:#f8fafc; text-align:center;}
  
  .select-box { 
    width: 100%; padding:14px; border-radius:8px; border:1px solid #334155; 
    background:#0f172a; color:#fff; font-size:16px; outline:none; cursor:pointer;
    text-align: center; -webkit-appearance: none; appearance: none;
  }
  .select-box:focus { border-color:#3b82f6; }
  
  .btn{
    width: 100%; padding:14px; border-radius:8px; border:none; background:#3b82f6; 
    color:#fff; cursor:pointer; font-size:16px; font-weight:600; transition:background 0.2s;
    text-align: center;
  }
  .btn:hover{background:#2563eb;}
  .btn:disabled{background:#475569; cursor:not-allowed; opacity:0.7;}

  /* Current Number Box */
  .current-box {
    background: #1e293b; border: 1px dashed #3b82f6; padding: 15px; border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .current-box .num { font-size: 18px; font-weight: 700; color: #3b82f6; font-family: monospace; letter-spacing: 1px;}
  .clear-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;}
  
  /* Inbox Section */
  .inbox-header { text-align: center; margin: 10px 0 0 0; }
  .inbox-header h2 { font-size: 20px; color: #f8fafc; margin: 0; font-weight: 700; letter-spacing: 1px;}
  
  .inbox-list { display: flex; flex-direction: column; gap: 12px;}
  
  .msg-card {
    background: #1e293b; border-radius: 10px; padding: 15px; border: 1px solid #334155;
    cursor: pointer; transition: 0.2s; position: relative;
  }
  .msg-card:hover { border-color: #10b981; background: #1e293b; }
  .msg-card:active { transform: scale(0.98); }
  
  .msg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
  .msg-time { font-size: 11px; color: #94a3b8; }
  .msg-platform { font-size: 11px; background: #0f172a; padding: 3px 8px; border-radius: 4px; color: #cbd5e1;}
  
  .msg-number { font-size: 15px; font-weight: 700; color: #f8fafc; font-family: monospace; margin-bottom: 6px;}
  .msg-body { font-size: 13px; color: #cbd5e1; line-height: 1.5; word-break: break-word;}
  
  .otp-badge { display: inline-block; background: #10b981; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 14px;}

  .empty-state{ text-align:center; padding: 40px 20px; color: #64748b; font-size: 14px; background:#1e293b; border-radius:10px; border:1px solid #334155;}
  
  /* Copy Toast */
  #toast {
    visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff;
    text-align: center; border-radius: 8px; padding: 12px; position: fixed;
    z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%);
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s, bottom 0.3s;
  }
  #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
</style>
</head>
<body>

<header>
  <h1>Tamim Panel</h1>
  <div class="badge">
    📩 <span id="totalOTP">0</span>
  </div>
</header>

<div class="container">

  <!-- Control Panel -->
  <div class="control-panel">
    <h2>Get Number by Range</h2>
    <select id="rangeDropdown" class="select-box">
      <option value="">Loading ranges...</option>
    </select>
    <button class="btn" id="getNumberBtn" onclick="getNumber()">Get Number</button>
  </div>

  <!-- Current Number Box (Hidden initially) -->
  <div class="current-box" id="currentNumberBox" style="display: none;">
    <div>Current: <span class="num" id="currentNumberText">-</span></div>
    <button class="clear-btn" onclick="clearCurrentNumber()">Clear</button>
  </div>

  <!-- Inbox -->
  <div class="inbox-header">
    <h2>Inbox</h2>
  </div>
  
  <div class="inbox-list" id="inboxList">
    <div class="empty-state">Loading messages...</div>
  </div>

</div>

<!-- Toast for copy notification -->
<div id="toast">✅ OTP Copied to Clipboard!</div>

<script>
let currentNumber = "";
let refreshInterval = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  return res.json();
}

function extractOTP(text) {
  if (!text) return null;
  const ps = [/\b(\d{4,8})\b.{0,30}(?:code|otp|verification|pin)/i, /(?:code|otp|verification|pin)[^\d]{0,15}(\d{4,8})\b/i, /\b(\d{6})\b/, /\b(\d{4,8})\b/];
  for (const p of ps) { const m = text.match(p); if (m) return m[1]; }
  return null;
}

async function init() {
  await loadRanges();
  await loadInbox();
  
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(async () => {
    await loadInbox();
  }, 5000); // প্রতি ৫ সেকেন্ডে ইনবক্স আপডেট হবে
}

async function loadRanges() {
  try {
    const res = await api('/api/ranges');
    const dropdown = document.getElementById('rangeDropdown');
    
    if (!res.data || res.data.length === 0) {
      dropdown.innerHTML = `<option value="">No ranges available</option>`;
      return;
    }
    
    let options = `<option value="">Select Range...</option>`;
    res.data.forEach(r => {
      options += `<option value="${r}">${r}</option>`;
    });
    dropdown.innerHTML = options;
  } catch (e) {
    document.getElementById('rangeDropdown').innerHTML = `<option value="">Error loading</option>`;
  }
}

// Current Number সেট করা
function setCurrentNumber(num) {
  currentNumber = num;
  document.getElementById('currentNumberText').innerText = num;
  document.getElementById('currentNumberBox').style.display = 'flex';
  loadInbox(); // নতুন নাম্বার ফিল্টার করে ইনবক্স লোড করবে
}

function clearCurrentNumber() {
  currentNumber = "";
  document.getElementById('currentNumberBox').style.display = 'none';
  loadInbox(); // সব নাম্বারের ইনবক্স দেখাবে
}

// Get Number বাটনের কাজ
async function getNumber() {
  const range = document.getElementById('rangeDropdown').value;
  if (!range) return alert("Please select a Range first!");
  
  const btn = document.getElementById('getNumberBtn');
  btn.innerText = "Getting...";
  btn.disabled = true;

  try {
    const res = await api('/api/numbers/get', { 
      method: 'POST', body: JSON.stringify({ range })
    });
    
    if (res.success) {
      // কপি করা
      navigator.clipboard.writeText(res.number);
      // বক্সে দেখানো
      setCurrentNumber(res.number);
      // মেসেজ দেখানো
      showToast(`Number ${res.number} Selected!`);
      
      await loadRanges(); // ড্রপডাউন আপডেট
    } else {
      alert(res.message || "Failed");
    }
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    btn.innerText = "Get Number";
    btn.disabled = false;
  }
}

// Inbox লোড করা
async function loadInbox() {
  try {
    let url = '/api/messages/local?limit=100';
    if (currentNumber) url += `&number=${currentNumber}`;
    
    const res = await api(url);
    renderInbox(res.data || [], res.total || 0);
  } catch (e) {}
}

function renderInbox(msgs, totalCount) {
  document.getElementById('totalOTP').innerText = totalCount;
  const list = document.getElementById('inboxList');
  
  if (!msgs || msgs.length === 0) {
    list.innerHTML = `<div class="empty-state">No messages found.</div>`;
    return;
  }
  
  list.innerHTML = msgs.map(m => {
    const otp = m.otp || extractOTP(m.message);
    // মেসেজের ভেতরে OTP টা হাইলাইট করার জন্য
    let displayMsg = m.message;
    if (otp) {
      displayMsg = displayMsg.replace(otp, `<span class="otp-badge">${otp}</span>`);
    }
    
    // তারিখ ও সময় সুন্দর করে দেখানো
    const dateObj = new Date(m.received_at);
    const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    return `
      <div class="msg-card" onclick="copyOTP('${otp || ''}', '${m.message.replace(/'/g, "\\'")}')">
        <div class="msg-top">
          <span class="msg-time">${timeStr}</span>
          <span class="msg-platform">${m.source || 'Unknown'}</span>
        </div>
        <div class="msg-number">${m.number}</div>
        <div class="msg-body">${displayMsg}</div>
      </div>
    `;
  }).join('');
}

// OTP কপি করার ফাংশন
function copyOTP(otp, fullMsg) {
  const textToCopy = otp ? otp : fullMsg;
  navigator.clipboard.writeText(textToCopy).then(() => {
    showToast(otp ? `OTP (${otp}) Copied!` : `Message Copied!`);
  });
}

// টোস্ট মেসেজ দেখানোর ফাংশন
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.className = "show";
  setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
}

init();
</script>
</body>
</html>
